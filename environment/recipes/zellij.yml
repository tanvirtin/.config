name: zellij
description: Install Zellij terminal workspace (tmux replacement)

steps:
  - name: Install zellij (macOS)
    install: zellij
    if: os == 'darwin'

  - name: Install zellij (Linux)
    run: |
      set -e
      mkdir -p "$HOME/.local/bin"
      if command -v apt-get >/dev/null 2>&1 && apt-cache show zellij >/dev/null 2>&1; then
        sudo apt-get install -y zellij
      else
        ARCH="$(uname -m)"
        curl -fsSL "https://github.com/zellij-org/zellij/releases/latest/download/zellij-${ARCH}-unknown-linux-musl.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" zellij
      fi
    if: os == 'linux'
