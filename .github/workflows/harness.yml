name: Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: environment/config/nvim
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz
          tar -C "$HOME" -xzf "$RUNNER_TEMP/nvim.tar.gz"
          echo "$HOME/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          "$HOME/nvim-linux-x86_64/bin/nvim" --version | head -1

      - name: Check out vgit
        run: git clone --depth 1 --branch alpha-v2.0.x https://github.com/tanvirtin/vgit.nvim.git "$HOME/workspace/vgit.nvim"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install Lua tools
        run: |
          luarocks install vusted
          luarocks install luacheck

      - name: Install stylua
        run: |
          cargo install stylua --version 2.0.2
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check and test
        run: make ci
